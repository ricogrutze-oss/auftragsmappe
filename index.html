function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
  const aa = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(aa));
}

function planRouteForSelection(tabKey){
  const ids = Array.from(selection[tabKey]);
  const items = auftraege.filter(a => ids.includes(a.id) && a.koordinaten);
  const skipped = ids.length - items.length;
  if(items.length === 0){
    showToast('Keine der ausgewählten Aufträge hat Koordinaten');
    return;
  }
  if(skipped > 0) showToast(`${skipped} ohne Koordinaten werden übersprungen`);

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      (pos) => buildAndOpenRoute(items, { lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => buildAndOpenRoute(items, null),
      { timeout: 6000 }
    );
  } else {
    buildAndOpenRoute(items, null);
  }
}

function buildAndOpenRoute(items, start){
  const remaining = items.slice();
  const route = [];
  let current = start;
  if(!current){
    current = { lat: remaining[0].koordinaten.lat, lon: remaining[0].koordinaten.lon };
    route.push(remaining.shift());
  }
  while(remaining.length){
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((it, idx) => {
      const dist = haversineKm(current.lat, current.lon, it.koordinaten.lat, it.koordinaten.lon);
      if(dist < bestDist){ bestDist = dist; bestIdx = idx; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    route.push(next);
    current = { lat: next.koordinaten.lat, lon: next.koordinaten.lon };
  }

  const originParam = start ? `${start.lat},${start.lon}` : `${route[0].koordinaten.lat},${route[0].koordinaten.lon}`;
  const destination = route[route.length - 1];
  const destParam = `${destination.koordinaten.lat},${destination.koordinaten.lon}`;
  const waypointItems = start ? route.slice(0, -1) : route.slice(1, -1);
  const waypointsParam = waypointItems.map(it => `${it.koordinaten.lat},${it.koordinaten.lon}`).join('|');

  let url = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${destParam}&travelmode=driving`;
  if(waypointsParam) url += `&waypoints=${encodeURIComponent(waypointsParam)}`;
  window.open(url, '_blank');
}

function getCellRenderer(key){
  if(CELL_RENDERERS[key]) return CELL_RENDERERS[key];

  if(cf){
    return (a) => `<td data-label="${escapeHtml(cf.label)}">

        onchange="updateCustomField('${a.id}','${key}', this.value)" placeholder="–">

}

function getOrderedVisibleColumns(){
  let order = (settings.columnOrder && settings.columnOrder.length) ? settings.columnOrder.slice() : DEFAULT_COLUMN_ORDER.slice();
  const vc = settings.visibleColumns || DEFAULT_VISIBLE_COLUMNS;
  (settings.customFields||[]).forEach(cf => { if(!order.includes(cf.key)) order.push(cf.key); });
  return order.filter(k => vc[k] !== false && getCellRenderer(k));
}

function getColumnLabel(key){
  if(COLUMN_LABELS[key]) return COLUMN_LABELS[key];
  const cf = (settings.customFields||[]).find(c => c.key === key);
  return cf ? cf.label : key;
}

  const cols = getOrderedVisibleColumns();

  const headCells = [`<th><input type="checkbox" ${allChecked?'checked':''} onchange="toggleSelectAll('${tabKey}', this.checked)"></th>`, '<th>Kundencode</th>']
    .concat(cols.map(key => `<th>${getColumnLabel(key)}</th>`))

  return `<div class="grid-wrap"><table>

}

  const el = document.getElementById('map-adressbuch');
  if(!el) return;
  if(adrMapInstance){ adrMapInstance.remove(); adrMapInstance = null; }

  if(withCoords.length === 0){
    el.outerHTML = `<div class="map-empty">Keine Koordinaten im Adressbuch vorhanden.</div>`;
    return;
  }

  const map = L.map('map-adressbuch');
  adrMapInstance = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  const cluster = L.markerClusterGroup({ maxClusterRadius: 50 });
  const bounds = [];
  withCoords.forEach(e => {
    const marker = L.marker([e.koordinaten.lat, e.koordinaten.lon]);
    marker.bindPopup(`
      <div class="pop-code">${escapeHtml(e.kundenname || e.kundencode || 'Messpunkt')}</div>
      ${e.adresse ? `<div style="margin-top:4px">${escapeHtml(e.adresse)}</div>` : ''}
      ${e.zaehlerplatzId ? `<div class="muted" style="font-family:var(--font-mono);font-size:11px">${escapeHtml(e.zaehlerplatzId)}</div>` : ''}
      ${e.telefonnummer ? `<div class="muted">${escapeHtml(e.telefonnummer)}</div>` : ''}
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="btn small" onclick="navigateToAdr('${e.id}')" style="flex:1">🧭 Navigation</button>
        <button class="btn small primary" onclick="jumpToAdressbuchEntry('${e.id}')" style="flex:1">✏️ Öffnen</button>
      </div>
    `);
    cluster.addLayer(marker);
    bounds.push([e.koordinaten.lat, e.koordinaten.lon]);
  });
  map.addLayer(cluster);
  map.fitBounds(bounds, { padding: [30,30] });
}

function navigateToAdr(id){
  const e = adressbuch.find(x => x.id === id);
  if(!e) return;
  let url;
  if(e.koordinaten) url = `https://www.google.com/maps/dir/?api=1&destination=${e.koordinaten.lat},${e.koordinaten.lon}`;
  else if(e.adresse) url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(e.adresse)}`;
  else { showToast('Keine Adresse oder Koordinaten hinterlegt'); return; }
  window.open(url, '_blank');
}

function jumpToAdressbuchEntry(id){
  adrViewMode = 'liste';

function toggleAdrDetails(id){

let adrViewMode = 'liste';

function renderAdressbuch(){
  if(adressbuch.length === 0){
    return `<div class="empty-state">
      <div class="big">Adressbuch ist leer</div>
      <div>Einträge entstehen automatisch beim Import und bleiben dauerhaft erhalten.</div>
    </div>`;
  }
  const q = adrSearch.trim().toLowerCase();
  const filtered = !q ? adressbuch : adressbuch.filter(e => {
    const haystack = [e.adresse, e.kundenname, e.zaehlerplatzId, e.kundencode].map(v=>(v||'').toString().toLowerCase()).join(' ');
    return haystack.includes(q);
  });

  const searchBar = `
    <div class="filter-bar">
      <input type="text" id="adrSearchInput" class="filter-search" placeholder="Suchen nach Ort, Ortsteil, Straße oder Name…"
        value="${escapeHtml(adrSearch)}" oninput="setAdrSearch(this.value)">
      ${filtered.length !== adressbuch.length ? `<span class="count-pill">${filtered.length} von ${adressbuch.length}</span>` : ''}
    </div>`;

  const toggleHtml = `
    <div class="view-toggle">
      <button class="btn small ${adrViewMode==='liste'?'active':''}" onclick="setAdrViewMode('liste')">📋 Liste</button>
      <button class="btn small ${adrViewMode==='karte'?'active':''}" onclick="setAdrViewMode('karte')">🗺️ Karte</button>
    </div>`;

  if(filtered.length === 0){
    return searchBar + toggleHtml + `<div class="empty-state"><div class="big">Keine Treffer</div><div>Versuch einen anderen Suchbegriff.</div></div>`;
  }

  if(adrViewMode === 'karte'){
    setTimeout(() => initAdrMap(filtered), 0);
    return searchBar + toggleHtml + `<div id="map-adressbuch" style="height:560px;border-radius:10px;overflow:hidden;border:1px solid var(--line)"></div>`;
  }

  if(adrMapInstance){ adrMapInstance.remove(); adrMapInstance = null; }

  const cards = filtered.slice().sort((a,b)=>(a.adresse||'').localeCompare(b.adresse||'')).map(e => {
    const detailsOpen = !!adrDetailsOpen[e.id];
    return `
    <div class="adr-card">
      <div class="adr-card-main">
        <input class="adr-name-input" type="text" value="${escapeHtml(e.kundenname)}" placeholder="Kundenname"
          onchange="updateAdrField('${e.id}','kundenname', this.value)">
        <input class="adr-addr-input" type="text" value="${escapeHtml(e.adresse)}" placeholder="Adresse"
          onchange="updateAdrField('${e.id}','adresse', this.value)">
        <input class="adr-phone-input" type="text" value="${escapeHtml(e.telefonnummer)}" placeholder="Telefonnummer"
          onchange="updateAdrField('${e.id}','telefonnummer', this.value)">
      </div>
      <div class="adr-card-actions">
        ${e.telefonnummer
          ? phoneButtonsHtml(e.telefonnummer)
          : `<button class="icon-btn" onclick="searchPhoneForAdr('${e.id}')" title="Im Web nach Telefonnummer suchen">🔍</button>`}
        <button class="icon-btn" onclick="toggleAdrDetails('${e.id}')" title="Details">${detailsOpen ? '▲' : '▼'}</button>
        <button class="icon-btn" onclick="openAdrHistory('${e.id}')" title="Verlauf">🕒 ${e.history.length}</button>
      </div>
      ${detailsOpen ? `
        <div class="adr-card-details">
          <div class="field"><label>E-Mail</label><input class="cell-input" type="text" value="${escapeHtml(e.email||'')}" onchange="updateAdrField('${e.id}','email', this.value)"></div>
          <div class="field-row">
            <div class="field"><label>Zählerplatz-ID</label><input class="cell-input" type="text" value="${escapeHtml(e.zaehlerplatzId||'')}" onchange="updateAdrField('${e.id}','zaehlerplatzId', this.value)" style="font-family:var(--font-mono);font-size:12px"></div>
            <div class="field"><label>Standort</label><input class="cell-input" type="text" value="${escapeHtml(e.standort||'')}" onchange="updateAdrField('${e.id}','standort', this.value)"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Zähler</label><input class="cell-input" type="text" value="${escapeHtml(e.zaehler||'')}" onchange="updateAdrField('${e.id}','zaehler', this.value)"></div>
            <div class="field"><label>Bauform Zähler</label><input class="cell-input" type="text" value="${escapeHtml(e.bauform||'')}" onchange="updateAdrField('${e.id}','bauform', this.value)"></div>
          </div>
          <div class="field"><label>Koordinaten</label><input class="cell-input" type="text" value="${escapeHtml(fmtCoords(e.koordinaten))}" placeholder="52.130, 11.630" onchange="updateAdrCoordsField('${e.id}', this.value)" style="font-family:var(--font-mono);font-size:12px"></div>
          <p class="hint">Kundencode: <span class="muted">${escapeHtml(e.kundencode || '–')}</span></p>
        </div>` : ''}
    </div>`;
  }).join('');

  return searchBar + toggleHtml + `<div class="adr-card-list">${cards}</div>`;
}
function updateAdrCoordsField(entryId, value){
  if(!value.trim()){ updateAdrCoords(entryId, null); render(); return; }
  const parsed = parseCoords(value);
  if(!parsed){ showToast('Ungültiges Koordinatenformat, z.B. 52.130, 11.630'); render(); return; }
  updateAdrCoords(entryId, parsed);
  showToast('Gespeichert');
}

/* ---------------------------------------------------------------
   Field updates
--------------------------------------------------------------- */
function updateCustomField(id, key, value, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  if(!a.customFields) a.customFields = {};
  const oldVal = a.customFields[key] || '';
  if(oldVal === value) return;
  a.history.push({ ts: nowIso(), field: key, old: oldVal, new: value });
  a.customFields[key] = value;
  saveAuftraege();
  if(!silent) showToast('Gespeichert');
}

function updateAuftragField(id, field, value, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const oldVal = a[field] || '';
  if(oldVal === value) return;
  a.history.push({ ts: nowIso(), field, old: oldVal, new: value });
  a[field] = value;
  saveAuftraege();

  // propagate persistent customer/meter fields into address book
  const propagatedFields = ['telefonnummer','email','adresse','kundenname','zaehler','bauform','standort'];
  if(propagatedFields.includes(field) && a.adrEntryId){
    updateAdrField(a.adrEntryId, field, value);
  }
  if(!silent) showToast('Gespeichert');
}

function setStatus(id, newStatus, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const old = a.status;
  if(old === newStatus) return;
  a.history.push({ ts: nowIso(), field:'status', old: STATUS[old].label, new: STATUS[newStatus].label });
  a.status = newStatus;
  saveAuftraege();
  if(!silent){
    render();
    showToast(newStatus === 'erledigt' ? 'Als erledigt markiert' : 'Status aktualisiert');
  }
}

/* ---------------------------------------------------------------
   Wiedervorlage / Rückruf-Erinnerung
--------------------------------------------------------------- */
function setWiedervorlageQuick(auftragId, daysFromNow){
  const d = new Date();
  d.setDate(d.getDate() + daysFromNow);
  const iso = d.toISOString().slice(0,10);
  const datumEl = document.getElementById('edit_wiedervorlage_datum');
  const zeitEl = document.getElementById('edit_wiedervorlage_zeit');
  if(datumEl) datumEl.value = iso;
  const zeit = (zeitEl && zeitEl.value) ? zeitEl.value : '09:00';
  if(zeitEl) zeitEl.value = zeit;
  saveWiedervorlage(auftragId, iso, zeit);
}
function saveWiedervorlageFromModal(auftragId){
  const datumEl = document.getElementById('edit_wiedervorlage_datum');
  const zeitEl = document.getElementById('edit_wiedervorlage_zeit');
  const datum = datumEl ? datumEl.value : '';
  const zeit = (zeitEl && zeitEl.value) ? zeitEl.value : '09:00';
  if(!datum){ showToast('Bitte ein Datum wählen'); return; }
  saveWiedervorlage(auftragId, datum, zeit);
}
function clearWiedervorlage(auftragId){
  const a = auftraege.find(x => x.id === auftragId);
  if(!a || !a.wiedervorlage) return;
  a.history.push({ ts: nowIso(), field:'wiedervorlage', old: fmtDateDe(a.wiedervorlage.datum) + ' ' + a.wiedervorlage.zeit, new: 'entfernt' });
  a.wiedervorlage = null;
  saveAuftraege();
  render();
  showToast('Rückruf-Erinnerung entfernt');
}
function saveWiedervorlage(auftragId, datum, zeit){
  const a = auftraege.find(x => x.id === auftragId);
  if(!a) return;
  const oldVal = a.wiedervorlage ? (fmtDateDe(a.wiedervorlage.datum) + ' ' + a.wiedervorlage.zeit) : '';
  const newVal = fmtDateDe(datum) + ' ' + zeit;
  if(oldVal === newVal) return;
  a.history.push({ ts: nowIso(), field:'wiedervorlage', old: oldVal, new: newVal });
  a.wiedervorlage = { datum, zeit };
  saveAuftraege();
  render();
  showToast('Rückruf-Erinnerung gesetzt: ' + newVal);
}

function renderCustomFieldInputs(a){

function pad(n){ return n.toString().padStart(2,'0'); }

function generateIcs(){
  const a = auftraege.find(x => x.id === terminModalAuftragId);
  if(!a) return;
  const dateIso = document.getElementById('terminDate').value;
  const time = document.getElementById('terminTime').value;
  const duration = parseInt(document.getElementById('terminDuration').value, 10) || 60;
  const subject = document.getElementById('terminSubject').value || 'Termin';
  const location = document.getElementById('terminLocation').value || '';
  const attendee = document.getElementById('terminAttendee').value.trim();

  if(!dateIso || !time){ showToast('Bitte Datum und Uhrzeit angeben'); return; }
  if(!settings.organizerEmail){
    showToast('Bitte zuerst deine Absenderadresse hinterlegen');
    openSettingsModal();
    return;
  }

  const [y,mo,d] = dateIso.split('-').map(n=>parseInt(n,10));
  const [hh,mm] = time.split(':').map(n=>parseInt(n,10));
  const start = new Date(y, mo-1, d, hh, mm, 0);
  const end = new Date(start.getTime() + duration*60000);

  const dtStart = `${start.getFullYear()}${pad(start.getMonth()+1)}${pad(start.getDate())}T${pad(start.getHours())}${pad(start.getMinutes())}00`;
  const dtEnd = `${end.getFullYear()}${pad(end.getMonth()+1)}${pad(end.getDate())}T${pad(end.getHours())}${pad(end.getMinutes())}00`;
  const dtStamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const eventUid = (a.termin && a.termin.uid) ? a.termin.uid : (uid() + '@auftragsmappe');
  const seq = (a.termin && typeof a.termin.sequence === 'number') ? a.termin.sequence + 1 : 0;

  const descLines = [];
  if(a.kundenname) descLines.push('Kunde: ' + a.kundenname);
  if(a.telefonnummer) descLines.push('Telefon: ' + a.telefonnummer);
  if(a.zaehler) descLines.push('Zähler: ' + a.zaehler);
  if(a.auftragsbeschreibung) descLines.push('Beschreibung: ' + a.auftragsbeschreibung);
  if(a.kommentar) descLines.push('Notiz: ' + a.kommentar);
  const description = descLines.join(String.fromCharCode(10));

  const method = attendee ? 'REQUEST' : 'PUBLISH';
  let icsLines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Auftragsmappe//DE',
    'CALSCALE:GREGORIAN',
    'METHOD:' + method,
    'BEGIN:VEVENT',
    'UID:' + eventUid,
    'DTSTAMP:' + dtStamp,
    'DTSTART:' + dtStart,
    'DTEND:' + dtEnd,
    'SUMMARY:' + icsEscape(subject),
    'LOCATION:' + icsEscape(location),
    'DESCRIPTION:' + icsEscape(description),
    'ORGANIZER;CN=' + icsEscape(settings.organizerEmail) + ':mailto:' + settings.organizerEmail,
  ];
  if(attendee){
    icsLines.push('ATTENDEE;CN=' + icsEscape(a.kundencode) + ';RSVP=TRUE:mailto:' + attendee);
  }
  icsLines.push('STATUS:CONFIRMED');
  icsLines.push('SEQUENCE:' + seq);
  icsLines.push('END:VEVENT');
  icsLines.push('END:VCALENDAR');

  const icsContent = icsLines.join('\r\n');
  const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  const fileStamp = `${y}${pad(mo)}${pad(d)}_${pad(hh)}${pad(mm)}_${Date.now().toString().slice(-4)}`;
  link.download = `Termin_${(a.kundencode||'auftrag').replace(/[^a-z0-9]/gi,'_')}_${fileStamp}.ics`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  const oldTermin = a.termin ? `${a.termin.date} ${a.termin.time}` : '';
  a.termin = { dateIso, date: `${pad(d)}.${pad(mo)}.${y}`, time, duration, uid: eventUid, sequence: seq };
  a.history.push({ ts: nowIso(), field:'termin', old: oldTermin, new: `${a.termin.date} ${a.termin.time}` });
  if(a.status === 'offen'){
    a.history.push({ ts: nowIso(), field:'status', old: STATUS.offen.label, new: STATUS.termin_vereinbart.label });
    a.status = 'termin_vereinbart';
  }
  saveAuftraege();
  closeModal();
  render();
  showToast(attendee
    ? 'Termindatei heruntergeladen – öffnen und in Outlook senden'
    : 'Termindatei heruntergeladen – öffnen, um sie in den Kalender zu übernehmen');
}

function icsEscape(s){
  return (s||'').toString().replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

/* ---------------------------------------------------------------
   Init
--------------------------------------------------------------- */
(async function init(){
  await loadAll();
  await tryRestoreFolder();
  render();
})();

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
