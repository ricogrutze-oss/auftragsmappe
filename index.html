<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auftragsmappe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#143f3b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auftragsmappe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --bg: #eef1f0;
    --panel: #ffffff;
    --ink: #16221f;
    --ink-soft: #55635f;
    --line: #d7ddda;
    --line-soft: #e6eae8;
    --teal: #1f5c56;
    --teal-deep: #143f3b;
    --amber: #b5790a;
    --amber-bg: #fbeed4;
    --blue: #2b5a8c;
    --blue-bg: #dde7f2;
    --purple: #6a4c8c;
    --purple-bg: #e8e0f2;
    --red: #a3392f;
    --red-bg: #f5e0dd;
    --green: #2c7a4b;
    --green-bg: #dcefe1;
    --orange: #b5540a;
    --orange-bg: #fbe3d0;
    --cyan: #106b78;
    --cyan-bg: #d7eff2;
    --gray-bg: #e7e9e8;
    --font-display: 'IBM Plex Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{ overflow-x:hidden; width:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    width:100%;
  }
  ::selection{ background:var(--teal); color:#fff; }

  /* Header */
  header.app-head{
    background:var(--teal-deep);
    color:#eef4f2;
    padding:22px 28px 18px;
    border-bottom:4px solid var(--teal);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#8fbdb2;
    margin-bottom:4px;
  }
  .app-title{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:700;
    letter-spacing:-.01em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .app-title .stamp{
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:500;
    color:#9fcabf;
    border:1px solid #3a6f68;
    border-radius:3px;
    padding:2px 7px;
  }

  /* Toolbar */
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:14px 28px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
  }
  .btn{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:.12s ease;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--teal); color:var(--teal-deep); }
  .btn.primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn.primary:hover{ background:var(--teal-deep); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  .btn.ghost:hover{ color:var(--teal-deep); }
  .btn.danger{ color:var(--red); border-color:var(--red-bg); }
  .btn.danger:hover{ background:var(--red-bg); border-color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  input[type=file]{ display:none; }
  .spacer{ flex:1; }
  .count-pill{
    font-family:var(--font-mono);
    font-size:12px;
    background:var(--gray-bg);
    padding:3px 9px;
    border-radius:20px;
    color:var(--ink-soft);
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:2px;
    padding:0 28px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .tab{
    padding:12px 18px 11px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .tab .n{
    font-family:var(--font-mono);
    font-size:11px;
    background:var(--gray-bg);
    padding:1px 7px;
    border-radius:10px;
  }
  .tab.active{ color:var(--teal-deep); border-bottom-color:var(--teal); }
  .tab.active .n{ background:var(--teal); color:#fff; }
  .tab:hover:not(.active){ color:var(--ink); }

  main{ padding:20px 28px 60px; max-width:1400px; margin:0 auto; }

  .empty-state{
    padding:70px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:var(--font-display);
    font-size:17px;
    color:var(--ink);
    margin-bottom:6px;
    font-weight:600;
  }

  /* Table */
  .grid-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:11px 12px;
    background:#f6f8f7;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--line-soft);
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#fafcfb; }
  .code{ font-family:var(--font-mono); font-size:12.5px; color:var(--teal-deep); font-weight:600; }
  .code-sm{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); font-weight:500; letter-spacing:.01em; }
  .ro-value{ font-size:13px; color:var(--ink); line-height:1.4; }
  .ro-info-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;
    margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line-soft);
  }
  .ro-info-item{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ro-info-label{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .ro-info-val{ font-size:13.5px; color:var(--ink); word-break:break-word; }
  .custom-field-list{ display:flex; flex-direction:column; gap:4px; margin-bottom:4px; }
  .custom-field-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px; background:#f6f8f7; border-radius:6px; font-size:13px;
  }
  .muted{ color:var(--ink-soft); }
  .cell-input{
    width:100%;
    border:1px solid transparent;
    background:transparent;
    font-family:var(--font-body);
    font-size:13px;
    padding:5px 7px;
    border-radius:5px;
    color:var(--ink);
  }
  .cell-input:hover{ border-color:var(--line); }
  .cell-input:focus{ outline:none; border-color:var(--teal); background:#fff; }
  textarea.cell-input{ resize:vertical; min-height:34px; font-family:var(--font-body); }

  select.status-select{
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:600;
    border:none;
    border-radius:20px;
    padding:6px 26px 6px 12px;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-repeat:no-repeat;
    background-position:right 9px center;
    background-size:9px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%23555'/></svg>");
  }
  .st-offen{ background:var(--gray-bg); color:#3d4744; }
  .st-in_bearbeitung{ background:var(--amber-bg); color:var(--amber); }
  .st-termin_vereinbart{ background:var(--blue-bg); color:var(--blue); }
  .st-kunde_rueckmeldung{ background:var(--purple-bg); color:var(--purple); }
  .st-anlage_nicht_fertig{ background:var(--red-bg); color:var(--red); }
  .st-warte_planung{ background:var(--orange-bg); color:var(--orange); }
  .st-inbetriebnahme_erfolgt{ background:var(--cyan-bg); color:var(--cyan); }
  .st-erledigt{ background:var(--green-bg); color:var(--green); }

  .termin-chip{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--blue);
    background:var(--blue-bg);
    padding:4px 9px;
    border-radius:5px;
    white-space:nowrap;
  }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:6px;
    padding:6px 9px;
    font-size:12px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .icon-btn:hover{ border-color:var(--teal); color:var(--teal-deep); }

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,26,24,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:16px;
  }
  .modal{
    background:#fff; border-radius:12px; width:100%; max-width:520px;
    max-height:90vh; overflow-y:auto; overflow-x:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    padding:18px 22px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{ margin:0; font-family:var(--font-display); font-size:16px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:14px 22px 20px; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid var(--line-soft); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px;
    font-family:var(--font-body); font-size:13.5px; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.5; }
  .close-x{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); }

  .mapping-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .mapping-row label{ width:150px; font-size:13px; font-weight:600; flex-shrink:0; }
  .mapping-row select{ flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .req-star{ color:var(--red); }

  .history-list{ list-style:none; padding:0; margin:0; }
  .history-list li{
    padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;
  }
  .history-list li:last-child{ border-bottom:none; }
  .history-list .ts{ font-family:var(--font-mono); color:var(--ink-soft); font-size:11px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--teal-deep); color:#fff; padding:11px 20px; border-radius:8px;
    font-size:13px; font-weight:500; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.25);
    display:none;
  }

  .view-toggle{ display:flex; gap:6px; margin-bottom:14px; align-items:center; }
  .filter-bar{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    margin-bottom:12px; padding:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px;
  }
  .filter-search{
    flex:1; min-width:180px; padding:8px 12px; border:1px solid var(--line);
    border-radius:20px; font-family:var(--font-body); font-size:13px;
  }
  .filter-search:focus{ outline:none; border-color:var(--teal); }
  .filter-select{
    padding:8px 12px; border:1px solid var(--line); border-radius:20px;
    font-family:var(--font-body); font-size:12.5px; background:#fff; color:var(--ink);
  }
  .agenda-group{ margin-bottom:18px; }
  .agenda-date-header{
    font-family:var(--font-display); font-weight:700; font-size:14px;
    color:var(--teal-deep); padding:8px 14px; background:#f6f8f7;
    border-bottom:1px solid var(--line);
  }
  .agenda-date-header.is-today{ color:var(--teal); background:var(--green-bg); }
  .agenda-date-header.is-past{ color:var(--ink-soft); }
  .agenda-item{
    display:flex; align-items:center; gap:14px; padding:12px 14px;
    border-bottom:1px solid var(--line-soft); cursor:pointer;
  }
  .agenda-item:hover{ background:#fafcfb; }
  .agenda-item:last-child{ border-bottom:none; }
  .agenda-time{
    font-family:var(--font-mono); font-weight:600; font-size:13px;
    color:var(--blue); min-width:48px;
  }
  .agenda-main{ flex:1; min-width:0; }
  .agenda-title{ font-size:13.5px; font-weight:600; }
  .agenda-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .adr-card-list{ display:flex; flex-direction:column; gap:10px; }
  .adr-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap;
    max-width:100%; box-sizing:border-box;
  }
  .adr-card-main{ flex:1 1 160px; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .adr-name-input, .adr-addr-input, .adr-phone-input{ width:100%; max-width:100%; box-sizing:border-box; }
  .adr-name-input{
    border:none; background:transparent; font-family:var(--font-display); font-weight:700;
    font-size:15.5px; color:var(--ink); padding:2px 4px; border-radius:5px;
  }
  .adr-name-input:hover, .adr-addr-input:hover, .adr-phone-input:hover{ background:var(--gray-bg); }
  .adr-name-input:focus, .adr-addr-input:focus, .adr-phone-input:focus{ outline:none; background:#fff; border:1px solid var(--teal); }
  .adr-addr-input{
    border:none; background:transparent; font-family:var(--font-body); font-size:13.5px;
    color:var(--ink); padding:2px 4px; border-radius:5px;
  }
  .adr-phone-input{
    border:none; background:transparent; font-family:var(--font-mono); font-size:12.5px;
    color:var(--ink-soft); padding:2px 4px; border-radius:5px;
  }
  .adr-card-actions{ display:flex; gap:6px; flex-shrink:0; }
  .adr-card-details{
    width:100%; margin-top:8px; padding-top:12px; border-top:1px solid var(--line-soft);
    box-sizing:border-box;
  }
  .view-toggle .btn.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .settings-section{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:16px;
  }
  .settings-section h4{
    margin:0 0 12px; font-family:var(--font-display); font-size:14px; color:var(--teal-deep);
  }
  .settings-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .map-empty{ height:200px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .leaflet-popup-content{ font-family:var(--font-body); font-size:12.5px; min-width:180px; }
  .leaflet-popup-content .pop-code{ font-family:var(--font-mono); font-weight:700; color:var(--teal-deep); }
  .leaflet-popup-content .pop-status{ display:inline-block; margin-top:4px; padding:2px 8px; border-radius:10px; font-weight:600; font-size:11px; }
  .col-picker label{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13.5px; font-weight:500; border-bottom:1px solid var(--line-soft); }
  .col-picker label:last-child{ border-bottom:none; }
  .col-picker input{ width:16px; height:16px; }
  .col-picker-row{
    display:flex; align-items:center; gap:10px; padding:7px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .col-picker-row:last-child{ border-bottom:none; }
  .col-picker-move{ display:flex; flex-direction:column; gap:2px; }
  .col-picker-move .icon-btn{ padding:2px 7px; font-size:10px; line-height:1; }

  @media (max-width:800px){
    header.app-head, .toolbar, .tabs, main{ padding-left:14px; padding-right:14px; }
    .mapping-row{ flex-wrap:wrap; }
    .mapping-row label{ width:100%; }
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ display:none; }
    tbody tr{ border-bottom:6px solid var(--bg); padding:10px 0; }
    tbody td{ border-bottom:none; padding:6px 12px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
    tbody td::before{ content: attr(data-label); font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--ink-soft); flex-shrink:0; }
    .modal-backdrop{ padding:0; align-items:flex-end; }
    .modal{ max-width:100%; max-height:92vh; border-radius:16px 16px 0 0; }
    .field-row{ flex-wrap:wrap; }
    .ro-info-grid{ grid-template-columns:1fr; }
    .adr-card{ flex-direction:column; align-items:stretch; }
    .adr-card-actions{ justify-content:flex-end; }
  }
</style>
</head>
<body>

<header class="app-head">
  <div class="eyebrow">Kundenvorgänge · Adressbuch · Termine</div>
  <div class="app-title">Auftragsmappe <span class="stamp" id="orgEmailStamp">Absender nicht gesetzt</span></div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="offen" onclick="switchTab('offen')">Offene Aufträge <span class="n" id="tabCountOffen">0</span></div>
  <div class="tab" data-tab="erledigt" onclick="switchTab('erledigt')">Erledigte Aufträge <span class="n" id="tabCountErledigt">0</span></div>
  <div class="tab" data-tab="termine" onclick="switchTab('termine')">📅 Termine <span class="n" id="tabCountTermine">0</span></div>
  <div class="tab" data-tab="adressbuch" onclick="switchTab('adressbuch')">Adressbuch <span class="n" id="tabCountAdr">0</span></div>
  <div class="tab" data-tab="einstellungen" onclick="switchTab('einstellungen')">⚙️ Einstellungen</div>
</div>

<main>
  <div id="view-offen"></div>
  <div id="view-erledigt" style="display:none"></div>
  <div id="view-termine" style="display:none"></div>
  <div id="view-adressbuch" style="display:none"></div>
  <div id="view-einstellungen" style="display:none"></div>
</main>

<input type="file" id="csvInput" accept=".csv,.tsv,.txt,.xlsx,.xls,.ods" style="display:none">
<input type="file" id="backupInput" accept=".json" style="display:none">

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------
   State
--------------------------------------------------------------- */
const STATUS = {
  offen:              { label: 'Offen', cls: 'st-offen' },
  in_bearbeitung:     { label: 'In Bearbeitung', cls: 'st-in_bearbeitung' },
  termin_vereinbart:  { label: 'Termin vereinbart', cls: 'st-termin_vereinbart' },
  kunde_rueckmeldung: { label: 'Kunde meldet sich zurück', cls: 'st-kunde_rueckmeldung' },
  anlage_nicht_fertig:{ label: 'Anlage noch nicht fertig', cls: 'st-anlage_nicht_fertig' },
  warte_planung:      { label: 'Warte auf Terminvergabe (Planung)', cls: 'st-warte_planung' },
  inbetriebnahme_erfolgt: { label: 'Inbetriebnahme erfolgt', cls: 'st-inbetriebnahme_erfolgt' },
  erledigt:           { label: 'Erledigt', cls: 'st-erledigt' },
};

let auftraege = [];   // array of Auftrag objects
let adressbuch = [];  // array of Adressbuch entries
let settings = { organizerEmail: '', lastImport: null };
let columnMapping = null; // { kundencode, vorgang, telefonnummer, adresse, zaehlerplatzId, koordinaten }
let currentTab = 'offen';
let pendingCsvRows = null; // rows waiting on mapping confirmation
let pendingCsvHeaders = null;
let terminModalAuftragId = null;
let historyModalTarget = null;
let viewMode = { offen: 'liste', erledigt: 'liste' };
let mapInstances = {};
const DEFAULT_VISIBLE_COLUMNS = {
  kundenname: true, vorgang: true, auftragsbeschreibung: true, status: true, telefonnummer: true, email: true, adresse: true,
  standort: true, zaehler: true, bauform: true,
  kommentar: true, termin: true, inbetriebnahmeDatum: true, koordinaten: true
};
const COLUMN_DEFS = [
  { key:'kundenname', label:'Kundenname' },
  { key:'vorgang', label:'Vorgang' },
  { key:'auftragsbeschreibung', label:'Auftragsbeschreibung' },
  { key:'status', label:'Status' },
  { key:'telefonnummer', label:'Telefon' },
  { key:'email', label:'E-Mail' },
  { key:'adresse', label:'Adresse' },
  { key:'standort', label:'Standort' },
  { key:'zaehler', label:'Zähler' },
  { key:'bauform', label:'Bauform Zähler' },
  { key:'kommentar', label:'Kommentar' },
  { key:'termin', label:'Termin' },
  { key:'inbetriebnahmeDatum', label:'Inbetriebnahme am' },
  { key:'koordinaten', label:'Koordinaten' },
];
const DEFAULT_COLUMN_ORDER = COLUMN_DEFS.map(c => c.key);

function uid(){ return 'a_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function nowIso(){ return new Date().toISOString(); }
function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
}
function norm(s){ return (s||'').toString().trim().toLowerCase(); }
function parseCoords(str){
  if(!str) return null;
  const parts = str.toString().split(/[,;\s]+/).map(p=>p.trim()).filter(Boolean);
  if(parts.length < 2) return null;
  const lat = parseFloat(parts[0].replace(',','.'));
  const lon = parseFloat(parts[1].replace(',','.'));
  if(isNaN(lat) || isNaN(lon)) return null;
  if(lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
  return { lat, lon };
}
function fmtCoords(c){ return c ? `${c.lat.toFixed(5)}, ${c.lon.toFixed(5)}` : ''; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.display='none'; }, 3200);
}

/* ---------------------------------------------------------------
   Storage — works both as a Claude artifact (window.storage) and as
   a standalone hosted app (localStorage + optional linked folder)
--------------------------------------------------------------- */
const hasClaudeStorage = (typeof window.storage !== 'undefined');
const FS_SUPPORTED = ('showDirectoryPicker' in window);
let folderHandle = null;
let folderNeedsPermission = false;
let folderSyncTimer = null;

async function kvGet(key){
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(key); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem('am_' + key); }catch(e){ return null; }
}
async function kvSet(key, val){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, val); return; }
    catch(e){ showToast('Speichern fehlgeschlagen: ' + key); return; }
  }
  try{ localStorage.setItem('am_' + key, val); }catch(e){ showToast('Speichern fehlgeschlagen: ' + key); }
}

async function loadAll(){
  try{ const v = await kvGet('auftraege'); auftraege = v ? JSON.parse(v) : []; }catch(e){ auftraege = []; }
  try{ const v = await kvGet('adressbuch'); adressbuch = v ? JSON.parse(v) : []; }catch(e){ adressbuch = []; }
  try{ const v = await kvGet('settings'); settings = v ? JSON.parse(v) : { organizerEmail:'', lastImport:null }; }
  catch(e){ settings = { organizerEmail:'', lastImport:null }; }
  if(!settings.visibleColumns){ settings.visibleColumns = Object.assign({}, DEFAULT_VISIBLE_COLUMNS); }
  // fill in any newly introduced columns for users with an older saved settings object
  DEFAULT_COLUMN_ORDER.forEach(k => { if(!(k in settings.visibleColumns)) settings.visibleColumns[k] = true; });
  if(!settings.columnOrder){ settings.columnOrder = DEFAULT_COLUMN_ORDER.slice(); }
  if(!settings.customFields){ settings.customFields = []; }
  // include any new columns that aren't in a saved order yet (appended at the end)
  DEFAULT_COLUMN_ORDER.forEach(k => { if(!settings.columnOrder.includes(k)) settings.columnOrder.push(k); });
  try{ const v = await kvGet('column-mapping'); columnMapping = v ? JSON.parse(v) : null; }catch(e){ columnMapping = null; }
}
async function persist(key, val){
  await kvSet(key, JSON.stringify(val));
}
const saveAuftraege  = () => { persist('auftraege', auftraege); scheduleFolderSync(); };
const saveAdressbuch = () => { persist('adressbuch', adressbuch); scheduleFolderSync(); };
const saveSettings   = () => { persist('settings', settings); scheduleFolderSync(); };
const saveMapping    = () => { persist('column-mapping', columnMapping); scheduleFolderSync(); };

/* --- Linked folder (Desktop Chrome/Edge only) ---------------------
   Stores a FileSystemDirectoryHandle in IndexedDB so the permission
   can be silently reused across page reloads (where the browser allows). */
function idbHandleDb(){
  return new Promise((resolve,reject) => {
    const req = indexedDB.open('auftragsmappe-fs', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle(){
  try{
    const db = await idbHandleDb();
    return await new Promise((resolve) => {
      const tx = db.transaction('handles','readonly');
      const r = tx.objectStore('handles').get('dir');
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  }catch(e){ return null; }
}
async function idbSetHandle(handle){
  try{
    const db = await idbHandleDb();
    await new Promise((resolve) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'dir');
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  }catch(e){}
}

async function chooseFolder(){
  if(!FS_SUPPORTED){
    showToast('Ordner-Verknüpfung wird nur in Chrome/Edge auf dem Desktop unterstützt');
    return;
  }
  try{
    const handle = await window.showDirectoryPicker();
    folderHandle = handle;
    folderNeedsPermission = false;
    await idbSetHandle(handle);
    await loadFromFolder(true);
    await saveToFolder();
    render();
    showToast('Ordner verknüpft — Daten werden ab jetzt automatisch dorthin gespeichert');
  }catch(e){ /* user cancelled the picker */ }
}
async function reconnectFolder(){
  if(!folderHandle) return;
  try{
    const perm = await folderHandle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      folderNeedsPermission = false;
      await loadFromFolder(true);
      render();
      showToast('Ordner wieder verbunden');
    } else {
      showToast('Zugriff wurde nicht erlaubt');
    }
  }catch(e){ showToast('Verbindung zum Ordner fehlgeschlagen'); }
}
async function tryRestoreFolder(){
  if(!FS_SUPPORTED) return;
  const handle = await idbGetHandle();
  if(!handle) return;
  folderHandle = handle;
  try{
    const perm = await handle.queryPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      folderNeedsPermission = false;
      await loadFromFolder(true);
    } else {
      folderNeedsPermission = true; // needs a click (user gesture) to reconnect
    }
  }catch(e){ folderNeedsPermission = true; }
}
async function loadFromFolder(silent){
  if(!folderHandle) return;
  try{
    const fileHandle = await folderHandle.getFileHandle('auftragsmappe-daten.json', { create:true });
    const file = await fileHandle.getFile();
    const text = await file.text();
    if(!text || !text.trim()) return;
    const data = JSON.parse(text);
    if(data.kind === 'auftragsmappe-sicherung'){
      mergeBackup(data, silent);
    }
  }catch(e){ console.error('loadFromFolder', e); }
}
async function saveToFolder(){
  if(!folderHandle) return;
  try{
    const payload = { kind:'auftragsmappe-sicherung', version:1, exportedAt: nowIso(), auftraege, adressbuch, settings, columnMapping };
    const fileHandle = await folderHandle.getFileHandle('auftragsmappe-daten.json', { create:true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    settings.folderLastSync = nowIso();
  }catch(e){ console.error('saveToFolder', e); }
}
function scheduleFolderSync(){
  if(!folderHandle || folderNeedsPermission) return;
  clearTimeout(folderSyncTimer);
  folderSyncTimer = setTimeout(saveToFolder, 1200);
}

/* ---------------------------------------------------------------
   Address book helpers
--------------------------------------------------------------- */
function findAdrEntry(zaehlerplatzId, kundencode){
  if(zaehlerplatzId){
    const hit = adressbuch.find(a => a.zaehlerplatzId && norm(a.zaehlerplatzId) === norm(zaehlerplatzId));
    if(hit) return hit;
  }
  return adressbuch.find(a => !a.zaehlerplatzId && a.kundencode && norm(a.kundencode) === norm(kundencode));
}
function upsertAdrFromImport(row){
  let entry = findAdrEntry(row.zaehlerplatzId, row.kundencode);
  if(!entry){
    entry = {
      id: uid(),
      kundencode: row.kundencode || '',
      zaehlerplatzId: row.zaehlerplatzId || '',
      kundenname: row.kundenname || '',
      adresse: row.adresse || '',
      telefonnummer: row.telefonnummer || '',
      email: row.email || '',
      koordinaten: row.koordinaten || null,
      zaehler: row.zaehler || '',
      bauform: row.bauform || '',
      standort: row.standort || '',
      history: [{ ts: nowIso(), field:'angelegt', old:'', new:'aus Datei-Import' }]
    };
    adressbuch.push(entry);
  } else {
    // Fill only empty fields, never overwrite manual edits
    if(!entry.adresse && row.adresse) entry.adresse = row.adresse;
    if(!entry.telefonnummer && row.telefonnummer) entry.telefonnummer = row.telefonnummer;
    if(!entry.email && row.email) entry.email = row.email;
    if(!entry.koordinaten && row.koordinaten) entry.koordinaten = row.koordinaten;
    if(!entry.kundenname && row.kundenname) entry.kundenname = row.kundenname;
    if(!entry.zaehler && row.zaehler) entry.zaehler = row.zaehler;
    if(!entry.bauform && row.bauform) entry.bauform = row.bauform;
    if(!entry.standort && row.standort) entry.standort = row.standort;
  }
  return entry;
}
function updateAuftragCoords(id, value){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const oldStr = fmtCoords(a.koordinaten);
  if(!value.trim()){
    if(!a.koordinaten) return;
    a.history.push({ ts: nowIso(), field:'koordinaten', old: oldStr, new: '' });
    a.koordinaten = null;
    saveAuftraege();
    if(a.adrEntryId) updateAdrCoords(a.adrEntryId, null);
    render();
    return;
  }
  const parsed = parseCoords(value);
  if(!parsed){
    showToast('Ungültiges Koordinatenformat, z.B. 52.130, 11.630');
    render();
    return;
  }
  a.history.push({ ts: nowIso(), field:'koordinaten', old: oldStr, new: fmtCoords(parsed) });
  a.koordinaten = parsed;
  saveAuftraege();
  if(a.adrEntryId) updateAdrCoords(a.adrEntryId, parsed);
  showToast('Gespeichert');
}
function updateAdrCoords(entryId, coords){
  const entry = adressbuch.find(a => a.id === entryId);
  if(!entry) return;
  const oldStr = fmtCoords(entry.koordinaten);
  const newStr = fmtCoords(coords);
  if(oldStr === newStr) return;
  entry.history.push({ ts: nowIso(), field:'koordinaten', old: oldStr, new: newStr });
  entry.koordinaten = coords;
  saveAdressbuch();

  const linked = auftraege.filter(a => a.adrEntryId === entryId);
  if(linked.length){
    linked.forEach(a => {
      a.history.push({ ts: nowIso(), field:'koordinaten', old: fmtCoords(a.koordinaten), new: newStr });
      a.koordinaten = coords;
    });
    saveAuftraege();
  }
}
function updateAdrField(entryId, field, newVal){
  const entry = adressbuch.find(a => a.id === entryId);
  if(!entry) return;
  const oldVal = entry[field] || '';
  if(oldVal === newVal) return;
  entry.history.push({ ts: nowIso(), field, old: oldVal, new: newVal });
  entry[field] = newVal;
  saveAdressbuch();

  // push master-data corrections down into any linked Aufträge (read-only there)
  const linked = auftraege.filter(a => a.adrEntryId === entryId);
  if(linked.length){
    linked.forEach(a => {
      if(field in a){
        a.history.push({ ts: nowIso(), field, old: a[field]||'', new: newVal });
        a[field] = newVal;
      }
    });
    saveAuftraege();
  }
}

/* ---------------------------------------------------------------
   File Import (CSV/TSV via PapaParse, Excel/ODS via SheetJS)
--------------------------------------------------------------- */
document.getElementById('csvInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();

  function proceed(rows, headers, sheetInfo){
    if(!rows || rows.length === 0){
      showToast('Keine Zeilen in der Datei gefunden');
      return;
    }
    pendingCsvRows = rows;
    pendingCsvHeaders = headers;
    if(sheetInfo) showToast(sheetInfo);
    if(!columnMapping || !mappingMatchesHeaders(pendingCsvHeaders)){
      openMappingModal(false);
    } else {
      runImport();
    }
  }

  if(ext === 'csv' || ext === 'tsv' || ext === 'txt'){
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results){
        proceed(results.data, results.meta.fields || []);
      },
      error: function(err){ showToast('Datei konnte nicht gelesen werden'); }
    });
  } else if(ext === 'xlsx' || ext === 'xls' || ext === 'ods') {
    const reader = new FileReader();
    reader.onload = function(evt){
      try{
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        const headers = rows.length ? Object.keys(rows[0]) : (XLSX.utils.sheet_to_json(sheet, { header:1 })[0] || []);
        const info = wb.SheetNames.length > 1
          ? `Tabellenblatt "${sheetName}" verwendet (von ${wb.SheetNames.length} Blättern)`
          : null;
        proceed(rows, headers, info);
      }catch(err){
        showToast('Excel-Datei konnte nicht gelesen werden');
      }
    };
    reader.onerror = function(){ showToast('Datei konnte nicht gelesen werden'); };
    reader.readAsArrayBuffer(file);
  } else {
    showToast('Nicht unterstütztes Dateiformat: .' + ext);
  }
  e.target.value = '';
});

function mappingMatchesHeaders(headers){
  if(!columnMapping) return false;
  const req = ['kundencode','vorgang'];
  return req.every(k => headers.includes(columnMapping[k]));
}

function openMappingModal(manual){
  const headers = pendingCsvHeaders || (columnMapping ? Object.values(columnMapping).filter(v => typeof v === 'string' && v) : []);
  const basicFields = [
    { key:'kundencode', label:'Kundencode', required:true },
    { key:'vorgang', label:'Vorgang', required:true },
    { key:'auftragsbeschreibung', label:'Auftragsbeschreibung', required:false },
    { key:'telefonnummer', label:'Telefonnummer', required:false },
    { key:'email', label:'E-Mail', required:false },
    { key:'zaehlerplatzId', label:'Zählerplatz-ID', required:false },
  ];
  const kundeFields = [
    { key:'kundenname', label:'Kundenname (eine Spalte)' },
    { key:'vorname', label:'Vorname' },
    { key:'nachname', label:'Nachname' },
  ];
  const addressFields = [
    { key:'adresse', label:'Adresse (eine Spalte)' },
    { key:'strasse', label:'Straße' },
    { key:'hausnummer', label:'Hausnummer' },
    { key:'hausnummerzusatz', label:'Hausnummerzusatz' },
    { key:'ortsteil', label:'Ortsteil' },
    { key:'ort', label:'Ort' },
  ];
  const zaehlerFields = [
    { key:'zaehler', label:'Zähler(-nummer)' },
    { key:'bauform', label:'Bauform Zähler' },
    { key:'standort', label:'Standort' },
  ];
  const coordFields = [
    { key:'breite', label:'Geographische Breite' },
    { key:'laenge', label:'Geographische Länge' },
    { key:'koordinaten', label:'oder: Koordinaten kombiniert (Breite, Länge)' },
  ];

  const opts = (['']).concat(headers).filter((v,i,a)=>a.indexOf(v)===i);
  const buildRow = (f) => {
    const current = columnMapping ? columnMapping[f.key] : '';
    const optionsHtml = opts.map(o => `<option value="${escapeHtml(o)}" ${o===current?'selected':''}>${o===''?'– nicht vorhanden –':escapeHtml(o)}</option>`).join('');
    return `<div class="mapping-row">
      <label>${f.label}${f.required?' <span class="req-star">*</span>':''}</label>
      <select id="map_${f.key}">${optionsHtml}</select>
    </div>`;
  };

  let bodyHtml;
  if(headers.length === 0){
    bodyHtml = `<p class="hint">Noch keine Spalten bekannt. Bitte zuerst eine Datei importieren.</p>`;
  } else {
    bodyHtml = `
      ${basicFields.map(buildRow).join('')}
      <p class="hint" style="margin:14px 0 8px"><strong>Kundenname</strong> — entweder eine fertige Spalte, oder aus Vor- und Nachname zusammensetzen:</p>
      ${kundeFields.map(buildRow).join('')}
      <p class="hint" style="margin:14px 0 8px"><strong>Adresse</strong> — entweder eine fertige Spalte wählen, oder aus mehreren Spalten zusammensetzen (z.B. Straße + Hausnummer + Ort):</p>
      ${addressFields.map(buildRow).join('')}
      <p class="hint" style="margin:14px 0 8px"><strong>Zähler</strong>:</p>
      ${zaehlerFields.map(buildRow).join('')}
      <p class="hint" style="margin:14px 0 8px"><strong>Koordinaten</strong> — entweder zwei getrennte Spalten, oder eine kombinierte:</p>
      ${coordFields.map(buildRow).join('')}
    `;
  }

  showModal(`
    <div class="modal-head"><h3>Spaltenzuordnung${manual?' bearbeiten':''}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0">Ordne die Spalten deiner Datei den benötigten Feldern zu. Diese Zuordnung wird gespeichert und beim nächsten Import automatisch wiederverwendet.</p>
      ${bodyHtml}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" ${headers.length===0?'disabled':''} onclick="confirmMapping(${manual})">Übernehmen${pendingCsvRows && !manual ? ' & importieren' : ''}</button>
    </div>
  `);
}

function confirmMapping(manual){
  const fields = ['kundencode','vorgang','auftragsbeschreibung','telefonnummer','email','zaehlerplatzId',
    'kundenname','vorname','nachname',
    'adresse','strasse','hausnummer','hausnummerzusatz','ortsteil','ort',
    'zaehler','bauform','standort',
    'breite','laenge','koordinaten'];
  const mapping = {};
  for(const f of fields){
    const el = document.getElementById('map_'+f);
    mapping[f] = el ? el.value : '';
  }
  if(!mapping.kundencode || !mapping.vorgang){
    showToast('Kundencode und Vorgang müssen zugeordnet werden');
    return;
  }
  columnMapping = mapping;
  saveMapping();
  closeModal();
  if(!manual && pendingCsvRows){
    runImport();
  } else {
    showToast('Spaltenzuordnung gespeichert');
  }
}

function toStr(v){
  if(v === undefined || v === null) return '';
  let s = v.toString().trim();
  // Excel sometimes stores identifiers (meter numbers etc.) as numbers,
  // which surfaces as a trailing ".0" once converted to text — strip that.
  if(/^\d+\.0$/.test(s)) s = s.slice(0, -2);
  return s;
}

function buildAddress(raw, m){
  if(m.adresse && toStr(raw[m.adresse]).trim()){
    return toStr(raw[m.adresse]).trim();
  }
  const strasse = m.strasse ? toStr(raw[m.strasse]).trim() : '';
  const hausnr = m.hausnummer ? toStr(raw[m.hausnummer]).trim() : '';
  const hausnrZusatz = m.hausnummerzusatz ? toStr(raw[m.hausnummerzusatz]).trim() : '';
  const ortsteil = m.ortsteil ? toStr(raw[m.ortsteil]).trim() : '';
  const ort = m.ort ? toStr(raw[m.ort]).trim() : '';

  const strassenteil = [strasse, (hausnr + hausnrZusatz)].filter(Boolean).join(' ');
  const parts = [ortsteil, strassenteil, ort].filter(Boolean);
  return parts.join(', ');
}

function buildCoords(raw, m){
  if(m.breite && m.laenge){
    const latRaw = toStr(raw[m.breite]).trim().replace(',', '.');
    const lonRaw = toStr(raw[m.laenge]).trim().replace(',', '.');
    const lat = parseFloat(latRaw);
    const lon = parseFloat(lonRaw);
    if(!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180){
      return { lat, lon };
    }
    return null;
  }
  if(m.koordinaten){
    return parseCoords(raw[m.koordinaten]);
  }
  return null;
}

function buildKundenname(raw, m){
  if(m.kundenname && toStr(raw[m.kundenname]).trim()){
    return toStr(raw[m.kundenname]).trim();
  }
  const vorname = m.vorname ? toStr(raw[m.vorname]).trim() : '';
  const nachname = m.nachname ? toStr(raw[m.nachname]).trim() : '';
  return [vorname, nachname].filter(Boolean).join(' ');
}

function runImport(){
  if(!pendingCsvRows || !columnMapping){ return; }
  const m = columnMapping;
  let added = 0, skippedDup = 0, skippedEmpty = 0;

  // build lookup of existing OPEN (not erledigt) auftraege keys
  const existingKeys = new Set(
    auftraege.filter(a => a.status !== 'erledigt')
             .map(a => norm(a.kundencode) + '|' + norm(a.vorgang))
  );

  for(const raw of pendingCsvRows){
    const kundencode = toStr(m.kundencode ? raw[m.kundencode] : '');
    const vorgang = toStr(m.vorgang ? raw[m.vorgang] : '');
    if(!kundencode.trim() || !vorgang.trim()){ skippedEmpty++; continue; }
    const key = norm(kundencode) + '|' + norm(vorgang);
    if(existingKeys.has(key)){ skippedDup++; continue; }

    const telefonnummer = toStr(m.telefonnummer ? raw[m.telefonnummer] : '');
    const email = toStr(m.email ? raw[m.email] : '');
    const auftragsbeschreibung = toStr(m.auftragsbeschreibung ? raw[m.auftragsbeschreibung] : '');
    const adresse = buildAddress(raw, m);
    const zaehlerplatzId = toStr(m.zaehlerplatzId ? raw[m.zaehlerplatzId] : '');
    const koordinaten = buildCoords(raw, m);
    const kundenname = buildKundenname(raw, m);
    const zaehler = toStr(m.zaehler ? raw[m.zaehler] : '');
    const bauform = toStr(m.bauform ? raw[m.bauform] : '');
    const standort = toStr(m.standort ? raw[m.standort] : '');

    const adrEntry = upsertAdrFromImport({ kundencode, vorgang, telefonnummer, email, adresse, zaehlerplatzId, koordinaten, kundenname, zaehler, bauform, standort });

    auftraege.push({
      id: uid(),
      kundencode: kundencode.trim(),

      telefonnummer: telefonnummer || adrEntry.telefonnummer || '',
      email: email || adrEntry.email || '',
      adresse: adresse || adrEntry.adresse || '',
      zaehlerplatzId: zaehlerplatzId || adrEntry.zaehlerplatzId || '',
      koordinaten: koordinaten || adrEntry.koordinaten || null,
      kundenname: kundenname || adrEntry.kundenname || '',
      zaehler: zaehler || adrEntry.zaehler || '',
      bauform: bauform || adrEntry.bauform || '',
      standort: standort || adrEntry.standort || '',
      adrEntryId: adrEntry.id,
      status: 'offen',
      kommentar: '',
      termin: null,
      importedAt: nowIso(),
      history: [{ ts: nowIso(), field:'angelegt', old:'', new:'aus Datei-Import' }]
    });
    existingKeys.add(key);
    added++;
  }

  saveAuftraege();
  saveAdressbuch();
  settings.lastImport = { ts: nowIso(), added, skippedDup, skippedEmpty };
  saveSettings();
  pendingCsvRows = null;
  render();
  showToast(`Import fertig: ${added} neu, ${skippedDup} Duplikate übersprungen`);
}

--------------------------------------------------------------- */
function exportBackup(){
  const payload = {
    kind: 'auftragsmappe-sicherung',
    version: 1,
    exportedAt: nowIso(),
    auftraege,
    adressbuch,
    settings,
    columnMapping,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'auftragsmappe-sicherung.json';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  settings.lastExport = nowIso();
  saveSettings();
  render();
  showToast('Sicherung heruntergeladen – im SharePoint-/OneDrive-Ordner ablegen');
}

document.getElementById('backupInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    let data;
    try{ data = JSON.parse(evt.target.result); }
    catch(err){ showToast('Datei ist kein gültiges Sicherungs-JSON'); return; }
    if(data.kind !== 'auftragsmappe-sicherung'){
      showToast('Das ist keine Auftragsmappen-Sicherungsdatei');
      return;
    }
    mergeBackup(data);
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Returns a dedupe+sorted union of two history arrays
function mergeHistories(h1, h2){
  const all = (h1||[]).concat(h2||[]);
  const seen = new Set();
  const out = [];
  for(const h of all){
    const key = h.ts + '|' + h.field + '|' + h.new;
    if(seen.has(key)) continue;
    seen.add(key);
    out.push(h);
  }
  out.sort((a,b) => new Date(a.ts) - new Date(b.ts));
  return out;
}
function lastTs(history){
  if(!history || history.length === 0) return 0;
  return Math.max(...history.map(h => new Date(h.ts).getTime()));
}
// Merge two records of the same entity: field values come from whichever
// side was edited more recently, history is the union of both, nothing lost.
function mergeRecord(local, incoming, fieldKeys){
  const mergedHistory = mergeHistories(local.history, incoming.history);
  const localNewer = lastTs(local.history) >= lastTs(incoming.history);
  const base = localNewer ? local : incoming;
  const merged = Object.assign({}, base);
  merged.history = mergedHistory;
  return merged;
}
function mergeCollection(localArr, incomingArr){
  const map = new Map();
  for(const item of localArr) map.set(item.id, item);
  for(const item of incomingArr){
    if(!map.has(item.id)){
      map.set(item.id, item);
    } else {
      map.set(item.id, mergeRecord(map.get(item.id), item));
    }
  }
  return Array.from(map.values());
}

function mergeBackup(data, silent){
  const beforeA = auftraege.length, beforeB = adressbuch.length;
  auftraege = mergeCollection(auftraege, data.auftraege || []);
  adressbuch = mergeCollection(adressbuch, data.adressbuch || []);

  // keep local settings unless locally unset
  if(!settings.organizerEmail && data.settings && data.settings.organizerEmail){
    settings.organizerEmail = data.settings.organizerEmail;
  }
  if(!columnMapping && data.columnMapping){
    columnMapping = data.columnMapping;
  }
  settings.lastMergeImport = { ts: nowIso(), sourceExportedAt: data.exportedAt };

  saveAuftraege();
  saveAdressbuch();
  saveSettings();
  if(columnMapping) saveMapping();
  if(!silent){
    render();
    showToast(`Sicherung zusammengeführt (${auftraege.length - beforeA >= 0 ? '+'+(auftraege.length-beforeA) : (auftraege.length-beforeA)} Aufträge, ${adressbuch.length - beforeB >= 0 ? '+'+(adressbuch.length-beforeB) : (adressbuch.length-beforeB)} Adressen neu)`);
  }
}

let tempColumnOrder = []; // [{key, label, visible}] while the picker modal is open

function syncTempColumnOrderFromDom(){
  tempColumnOrder.forEach(item => {
    const el = document.getElementById('colvis_'+item.key);
    if(el) item.visible = el.checked;
  });
}

function renderColumnPickerRows(){
  return tempColumnOrder.map((item, idx) => `
    <div class="col-picker-row">
      <div class="col-picker-move">
        <button class="icon-btn" ${idx===0?'disabled':''} onclick="moveColumnPicker(${idx}, -1)" title="Nach oben">▲</button>

      </div>

function openColumnPicker(){
  let order = (settings.columnOrder && settings.columnOrder.length) ? settings.columnOrder.slice() : DEFAULT_COLUMN_ORDER.slice();
  (settings.customFields||[]).forEach(cf => { if(!order.includes(cf.key)) order.push(cf.key); });
  const vc = settings.visibleColumns || DEFAULT_VISIBLE_COLUMNS;
  tempColumnOrder = order.filter(k => getColumnLabel(k)).map(k => ({ key:k, label:getColumnLabel(k), visible: vc[k] !== false }));

  showModal(`
    <div class="modal-head"><h3>Sichtbare Spalten &amp; Reihenfolge</h3><button class="close-x" onclick="closeModal()">✕</button></div>

function moveColumnPicker(index, direction){
  syncTempColumnOrderFromDom();
  const target = index + direction;
  if(target < 0 || target >= tempColumnOrder.length) return;
  const tmp = tempColumnOrder[index];
  tempColumnOrder[index] = tempColumnOrder[target];
  tempColumnOrder[target] = tmp;
  document.getElementById('colPickerBody').innerHTML = renderColumnPickerRows();
}

function saveColumnPicker(){
  syncTempColumnOrderFromDom();
  settings.columnOrder = tempColumnOrder.map(item => item.key);
  tempColumnOrder.forEach(item => { settings.visibleColumns[item.key] = item.visible !== false; });
  saveSettings();
  closeModal();
  render();
  showToast('Spaltenansicht gespeichert');
}

function slugify(label){
  return 'cf_' + label.toString().trim().toLowerCase()
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || ('feld' + Date.now());
}

function addCustomField(){
  const input = document.getElementById('newCustomFieldLabel');
  const label = input ? input.value.trim() : '';
  if(!label){ showToast('Bitte einen Namen für das Feld eingeben'); return; }
  if(!settings.customFields) settings.customFields = [];
  let key = slugify(label);
  let n = 1;
  while(settings.customFields.some(cf => cf.key === key) || COLUMN_LABELS[key]){
    key = slugify(label) + '_' + (++n);
  }
  settings.customFields.push({ key, label });
  if(!settings.visibleColumns) settings.visibleColumns = {};
  settings.visibleColumns[key] = true;
  saveSettings();
  render();
  showToast('Feld „' + label + '" hinzugefügt');
}

function removeCustomField(key){
  settings.customFields = (settings.customFields||[]).filter(cf => cf.key !== key);
  saveSettings();
  render();
  showToast('Feld entfernt (bereits eingetragene Werte in Aufträgen bleiben erhalten)');
}

function renderTermine(list){
  if(list.length === 0){
    return `<div class="empty-state">
      <div class="big">Noch keine Termine vereinbart</div>
      <div>Termine, die du über 📅 bei einem Auftrag festlegst, erscheinen hier chronologisch.</div>
    </div>`;
  }
  const todayIso = new Date().toISOString().slice(0,10);
  const sorted = list.slice().sort((a,b) => {
    const da = a.termin.dateIso + 'T' + a.termin.time, db = b.termin.dateIso + 'T' + b.termin.time;
    return da.localeCompare(db);
  });

  const groups = [];
  let currentGroup = null;
  sorted.forEach(a => {
    const d = a.termin.dateIso;
    if(!currentGroup || currentGroup.dateIso !== d){
      currentGroup = { dateIso: d, date: a.termin.date, items: [] };
      groups.push(currentGroup);
    }
    currentGroup.items.push(a);
  });

  const groupsHtml = groups.map(g => {
    const isPast = g.dateIso < todayIso;
    const isToday = g.dateIso === todayIso;
    const itemsHtml = g.items.map(a => {
      const color = { offen:'#55635f', in_bearbeitung:'#b5790a', termin_vereinbart:'#2b5a8c',
        kunde_rueckmeldung:'#6a4c8c', anlage_nicht_fertig:'#a3392f', warte_planung:'#b5540a',
        inbetriebnahme_erfolgt:'#106b78', erledigt:'#2c7a4b' }[a.status] || '#55635f';
      return `
        <div class="agenda-item" onclick="openAuftragEditModal('${a.id}')">
          <div class="agenda-time">${a.termin.time}</div>
          <div class="agenda-main">
            <div class="agenda-title"><span class="code">${escapeHtml(a.kundencode)}</span> ${escapeHtml(a.kundenname||'')}</div>
            <div class="agenda-sub">${escapeHtml(a.vorgang)}${a.adresse ? ' · ' + escapeHtml(a.adresse) : ''}</div>
          </div>
          <div class="pop-status" style="background:${color}22;color:${color};white-space:nowrap">${STATUS[a.status].label}</div>
        </div>`;
    }).join('');
    return `
      <div class="agenda-group">
        <div class="agenda-date-header ${isPast?'is-past':''} ${isToday?'is-today':''}">
          ${g.date}${isToday ? ' · Heute' : ''}
        </div>
        ${itemsHtml}
      </div>`;
  }).join('');

  return `<div class="grid-wrap" style="padding:8px 0">${groupsHtml}</div>`;
}

let filters = {
  offen:    { search:'', status:'', vorgang:'' },
  erledigt: { search:'', status:'', vorgang:'' }
};

function applyFilters(list, tabKey){
  const f = filters[tabKey];
  if(!f.search && !f.status && !f.vorgang) return list;
  const q = f.search.trim().toLowerCase();
  return list.filter(a => {
    if(f.status && a.status !== f.status) return false;
    if(f.vorgang && a.vorgang !== f.vorgang) return false;
    if(q){
      const haystack = [a.kundencode, a.kundenname, a.vorgang, a.adresse, a.standort,
        a.telefonnummer, a.email, a.zaehler, a.bauform, a.zaehlerplatzId, a.kommentar]
        .map(v => (v||'').toString().toLowerCase()).join(' ');
      if(!haystack.includes(q)) return false;
    }
    return true;
  });
}

function renderFilterBar(tabKey, fullList){
  const f = filters[tabKey];
  const vorgangOptions = Array.from(new Set(fullList.map(a => a.vorgang).filter(Boolean))).sort();
  const anyActive = !!(f.search || f.status || f.vorgang);
  return `
    <div class="filter-bar">
      <input type="text" id="filtersearch-${tabKey}" class="filter-search" placeholder="Suchen (Name, Adresse, Kundencode, Kommentar…)"
        value="${escapeHtml(f.search)}" oninput="setFilter('${tabKey}','search', this.value)">
      <select class="filter-select" onchange="setFilter('${tabKey}','status', this.value)">
        <option value="">Alle Status</option>
        ${Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${f.status===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="setFilter('${tabKey}','vorgang', this.value)">
        <option value="">Alle Vorgangstypen</option>
        ${vorgangOptions.map(v => `<option value="${escapeHtml(v)}" ${f.vorgang===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}
      </select>
      ${anyActive ? `<button class="btn small ghost" onclick="resetFilter('${tabKey}')">✕ Filter zurücksetzen</button>` : ''}
    </div>`;
}
function setFilter(tabKey, key, value){
  filters[tabKey][key] = value;
  const searchEl = document.getElementById('filtersearch-' + tabKey);
  const cursorPos = searchEl ? searchEl.selectionStart : null;

  const fullList = auftraege.filter(a => tabKey === 'erledigt' ? a.status === 'erledigt' : a.status !== 'erledigt');
  renderTabView(tabKey, fullList);

  if(key === 'search'){
    const newEl = document.getElementById('filtersearch-' + tabKey);
    if(newEl){
      newEl.focus();
      if(cursorPos !== null) newEl.setSelectionRange(cursorPos, cursorPos);
    }
  }
}
function resetFilter(tabKey){
  filters[tabKey] = { search:'', status:'', vorgang:'' };
  render();
}

function renderTabView(tabKey, fullList){
  const container = document.getElementById('view-' + tabKey);
  const list = applyFilters(fullList, tabKey);
  const toggleHtml = `
    <div class="view-toggle">
      <button class="btn small ${viewMode[tabKey]==='liste'?'active':''}" onclick="setViewMode('${tabKey}','liste')">📋 Liste</button>
      <button class="btn small ${viewMode[tabKey]==='karte'?'active':''}" onclick="setViewMode('${tabKey}','karte')">🗺️ Karte</button>
      ${viewMode[tabKey]==='karte' ? `
        <span style="width:1px;height:20px;background:var(--line);display:inline-block;margin:0 4px"></span>
        <span class="muted" style="font-size:12px">Farbe:</span>
        <button class="btn small ${mapColorMode[tabKey]==='status'?'active':''}" onclick="setMapColorMode('${tabKey}','status')">Status</button>
        <button class="btn small ${mapColorMode[tabKey]==='vorgang'?'active':''}" onclick="setMapColorMode('${tabKey}','vorgang')">Vorgangstyp</button>
      ` : ''}
      ${list.length !== fullList.length ? `<span class="count-pill" style="margin-left:6px">${list.length} von ${fullList.length}</span>` : ''}
    </div>`;
  const filterHtml = renderFilterBar(tabKey, fullList);

  if(viewMode[tabKey] === 'karte'){
    container.innerHTML = filterHtml + toggleHtml + renderMapLegend(tabKey, list) + `<div id="map-${tabKey}" style="height:540px;border-radius:10px;overflow:hidden;border:1px solid var(--line)"></div>`;
    initMapForTab(tabKey, list);
  } else {
    if(mapInstances[tabKey]){ mapInstances[tabKey].remove(); delete mapInstances[tabKey]; }
    container.innerHTML = filterHtml + toggleHtml + renderAuftragTable(list, tabKey === 'erledigt');
  }
}

function setViewMode(tabKey, mode){
  viewMode[tabKey] = mode;
  render();
}


let mapColorMode = { offen: 'status', erledigt: 'status' };

function colorForVorgang(str){
  const s = (str || '–').toString();
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = s.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 58%, 40%)`;
}

function initMapForTab(tabKey, list){
  const withCoords = list.filter(a => a.koordinaten);
  const el = document.getElementById('map-' + tabKey);
  if(!el) return;
  if(mapInstances[tabKey]){ mapInstances[tabKey].remove(); delete mapInstances[tabKey]; }

  if(withCoords.length === 0){
    el.outerHTML = `<div class="map-empty">Keine Koordinaten in ${tabKey === 'erledigt' ? 'den erledigten' : 'den offenen'} Aufträgen vorhanden.</div>`;
    return;
  }

  const map = L.map('map-' + tabKey);
  mapInstances[tabKey] = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  const statusColor = {
    offen:'#55635f', in_bearbeitung:'#b5790a', termin_vereinbart:'#2b5a8c',
    kunde_rueckmeldung:'#6a4c8c', anlage_nicht_fertig:'#a3392f',
    warte_planung:'#b5540a', inbetriebnahme_erfolgt:'#106b78', erledigt:'#2c7a4b'
  };
  const byVorgang = mapColorMode[tabKey] === 'vorgang';
  const colorFor = (a) => byVorgang ? colorForVorgang(a.vorgang) : (statusColor[a.status] || '#55635f');

  const bounds = [];
  withCoords.forEach(a => {
    const color = colorFor(a);
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 0 1px ${color}"></div>`,
      iconSize: [16,16], iconAnchor: [8,8]
    });
    const marker = L.marker([a.koordinaten.lat, a.koordinaten.lon], { icon }).addTo(map);
    marker.bindPopup(`
      <div class="pop-code">${escapeHtml(a.kundencode)}</div>
      ${a.kundenname ? `<div>${escapeHtml(a.kundenname)}</div>` : ''}
      <div>${escapeHtml(a.vorgang)}</div>
      <div class="pop-status" style="background:${color}22;color:${color}">${byVorgang ? escapeHtml(a.vorgang) : STATUS[a.status].label}</div>
      ${a.adresse ? `<div style="margin-top:6px">${escapeHtml(a.adresse)}</div>` : ''}
      ${a.telefonnummer ? `<div class="muted">${escapeHtml(a.telefonnummer)}</div>` : ''}
      <div style="margin-top:8px">
        <button class="btn small primary" onclick="openAuftragEditModal('${a.id}')" style="width:100%">✏️ Öffnen &amp; bearbeiten</button>
      </div>
    `);
    bounds.push([a.koordinaten.lat, a.koordinaten.lon]);
  });
  if(bounds.length === 1){ map.setView(bounds[0], 15); }
  else{ map.fitBounds(bounds, { padding: [30,30] }); }
}

function setMapColorMode(tabKey, mode){
  mapColorMode[tabKey] = mode;
  render();
}

function renderMapLegend(tabKey, list){
  if(mapColorMode[tabKey] !== 'vorgang') return '';
  const types = Array.from(new Set(list.filter(a=>a.koordinaten).map(a=>a.vorgang).filter(Boolean))).sort();
  if(types.length === 0) return '';
  const chips = types.map(t => `
    <span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);margin-right:10px">
      <span style="width:10px;height:10px;border-radius:50%;background:${colorForVorgang(t)};display:inline-block"></span>${escapeHtml(t)}
    </span>`).join('');
  return `<div style="padding:8px 2px 12px;line-height:2">${chips}</div>`;
}

const COLUMN_LABELS = Object.fromEntries(COLUMN_DEFS.map(c => [c.key, c.label]));

function simpleTextCell(a, key, label, placeholder){

function readonlyCell(a, key, label){

const CELL_RENDERERS = {
  kundenname: (a) => readonlyCell(a, 'kundenname', COLUMN_LABELS.kundenname),
  vorgang: (a) => `<td data-label="${COLUMN_LABELS.vorgang}">${escapeHtml(a.vorgang)}</td>`,

  status: (a) => `<td data-label="${COLUMN_LABELS.status}">

  standort: (a) => readonlyCell(a, 'standort', COLUMN_LABELS.standort),
  zaehler: (a) => readonlyCell(a, 'zaehler', COLUMN_LABELS.zaehler),
  bauform: (a) => readonlyCell(a, 'bauform', COLUMN_LABELS.bauform),
  kommentar: (a) => `<td data-label="${COLUMN_LABELS.kommentar}">
      <textarea class="cell-input" rows="1" onchange="updateAuftragField('${a.id}','kommentar', this.value)" placeholder="Notiz…">${escapeHtml(a.kommentar)}</textarea>
    </td>`,
  termin: (a) => `<td data-label="${COLUMN_LABELS.termin}">
      ${a.termin ? `<span class="termin-chip">${a.termin.date} · ${a.termin.time}</span>` : `<span class="muted">–</span>`}
    </td>`,
  inbetriebnahmeDatum: (a) => `<td data-label="${COLUMN_LABELS.inbetriebnahmeDatum}">
      <input class="cell-input" type="date" value="${escapeHtml(a.inbetriebnahmeDatum||'')}"
        onchange="updateAuftragField('${a.id}','inbetriebnahmeDatum', this.value)">
    </td>`,
  koordinaten: (a) => `<td data-label="${COLUMN_LABELS.koordinaten}"><span class="ro-value" style="font-family:var(--font-mono);font-size:12px">${escapeHtml(fmtCoords(a.koordinaten)) || '<span class=\'muted\'>–</span>'}</span></td>`,
};

function getCellRenderer(key){
  if(CELL_RENDERERS[key]) return CELL_RENDERERS[key];
  const cf = (settings.customFields||[]).find(c => c.key === key);
  if(cf){
    return (a) => `<td data-label="${escapeHtml(cf.label)}">
      <input class="cell-input" type="text" value="${escapeHtml(a.customFields ? a.customFields[key] : '')}"
        onchange="updateCustomField('${a.id}','${key}', this.value)" placeholder="–">
    </td>`;
  }
  return null;
}

function getOrderedVisibleColumns(){
  let order = (settings.columnOrder && settings.columnOrder.length) ? settings.columnOrder.slice() : DEFAULT_COLUMN_ORDER.slice();
  const vc = settings.visibleColumns || DEFAULT_VISIBLE_COLUMNS;
  (settings.customFields||[]).forEach(cf => { if(!order.includes(cf.key)) order.push(cf.key); });
  return order.filter(k => vc[k] !== false && getCellRenderer(k));
}

function getColumnLabel(key){
  if(COLUMN_LABELS[key]) return COLUMN_LABELS[key];
  const cf = (settings.customFields||[]).find(c => c.key === key);
  return cf ? cf.label : key;
}

function renderAuftragTable(list, isErledigtTab){
  if(list.length === 0){
    return `<div class="empty-state">
      <div class="big">${isErledigtTab ? 'Noch keine erledigten Vorgänge' : 'Keine offenen Vorgänge'}</div>
      <div>${isErledigtTab ? 'Erledigte Aufträge erscheinen hier automatisch.' : 'Importiere eine CSV- oder Excel-Datei, um Vorgänge anzulegen.'}</div>
    </div>`;
  }
  const cols = getOrderedVisibleColumns();

  const rows = list.slice().sort((a,b) => (a.kundencode||'').localeCompare(b.kundencode||'')).map(a => `
    <tr>
      <td data-label="Kundencode"><span class="code-sm">${escapeHtml(a.kundencode)}</span></td>
      ${cols.map(key => getCellRenderer(key)(a)).join('')}
      <td data-label="Aktionen">
        <div class="row-actions">
          <button class="icon-btn" onclick="openAuftragEditModal('${a.id}')" title="Bearbeiten">✏️</button>
          <button class="icon-btn" onclick="openTerminModal('${a.id}')" title="Termin festlegen">📅</button>
          <button class="icon-btn" onclick="openAuftragHistory('${a.id}')" title="Verlauf">🕒</button>
        </div>
      </td>
    </tr>
  `).join('');

  const headCells = ['<th>Kundencode</th>']
    .concat(cols.map(key => `<th>${getColumnLabel(key)}</th>`))
    .concat(['<th></th>'])
    .join('');

  return `<div class="grid-wrap"><table>
    <thead><tr>${headCells}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

let adrSearch = '';
let adrDetailsOpen = {};

function setAdrSearch(value){
  adrSearch = value;
  const el = document.getElementById('adrSearchInput');
  const cursorPos = el ? el.selectionStart : null;
  document.getElementById('view-adressbuch').innerHTML = renderAdressbuch();
  const newEl = document.getElementById('adrSearchInput');
  if(newEl){ newEl.focus(); if(cursorPos !== null) newEl.setSelectionRange(cursorPos, cursorPos); }
}
function toggleAdrDetails(id){
  adrDetailsOpen[id] = !adrDetailsOpen[id];
  document.getElementById('view-adressbuch').innerHTML = renderAdressbuch();
}

function renderAdressbuch(){
  if(adressbuch.length === 0){
    return `<div class="empty-state">
      <div class="big">Adressbuch ist leer</div>
      <div>Einträge entstehen automatisch beim Import und bleiben dauerhaft erhalten.</div>
    </div>`;
  }
  const q = adrSearch.trim().toLowerCase();
  const filtered = !q ? adressbuch : adressbuch.filter(e => {
    const haystack = [e.adresse, e.kundenname, e.zaehlerplatzId, e.kundencode].map(v=>(v||'').toString().toLowerCase()).join(' ');
    return haystack.includes(q);
  });

  const searchBar = `
    <div class="filter-bar">
      <input type="text" id="adrSearchInput" class="filter-search" placeholder="Suchen nach Ort, Ortsteil, Straße oder Name…"
        value="${escapeHtml(adrSearch)}" oninput="setAdrSearch(this.value)">
      ${filtered.length !== adressbuch.length ? `<span class="count-pill">${filtered.length} von ${adressbuch.length}</span>` : ''}
    </div>`;

  if(filtered.length === 0){
    return searchBar + `<div class="empty-state"><div class="big">Keine Treffer</div><div>Versuch einen anderen Suchbegriff.</div></div>`;
  }

  const cards = filtered.slice().sort((a,b)=>(a.adresse||'').localeCompare(b.adresse||'')).map(e => {
    const detailsOpen = !!adrDetailsOpen[e.id];
    return `
    <div class="adr-card">
      <div class="adr-card-main">
        <input class="adr-name-input" type="text" value="${escapeHtml(e.kundenname)}" placeholder="Kundenname"
          onchange="updateAdrField('${e.id}','kundenname', this.value)">
        <input class="adr-addr-input" type="text" value="${escapeHtml(e.adresse)}" placeholder="Adresse"
          onchange="updateAdrField('${e.id}','adresse', this.value)">
        <input class="adr-phone-input" type="text" value="${escapeHtml(e.telefonnummer)}" placeholder="Telefonnummer"
          onchange="updateAdrField('${e.id}','telefonnummer', this.value)">
      </div>
      <div class="adr-card-actions">
        ${!e.telefonnummer ? `<button class="icon-btn" onclick="searchPhoneForAdr('${e.id}')" title="Im Web nach Telefonnummer suchen">🔍</button>` : ''}
        <button class="icon-btn" onclick="toggleAdrDetails('${e.id}')" title="Details">${detailsOpen ? '▲' : '▼'}</button>
        <button class="icon-btn" onclick="openAdrHistory('${e.id}')" title="Verlauf">🕒 ${e.history.length}</button>
      </div>
      ${detailsOpen ? `
        <div class="adr-card-details">
          <div class="field"><label>E-Mail</label><input class="cell-input" type="text" value="${escapeHtml(e.email||'')}" onchange="updateAdrField('${e.id}','email', this.value)"></div>
          <div class="field"><label>Standort</label><input class="cell-input" type="text" value="${escapeHtml(e.standort||'')}" onchange="updateAdrField('${e.id}','standort', this.value)"></div>
          <div class="field-row">
            <div class="field"><label>Zähler</label><input class="cell-input" type="text" value="${escapeHtml(e.zaehler||'')}" onchange="updateAdrField('${e.id}','zaehler', this.value)"></div>
            <div class="field"><label>Bauform Zähler</label><input class="cell-input" type="text" value="${escapeHtml(e.bauform||'')}" onchange="updateAdrField('${e.id}','bauform', this.value)"></div>
          </div>
          <div class="field"><label>Koordinaten</label><input class="cell-input" type="text" value="${escapeHtml(fmtCoords(e.koordinaten))}" placeholder="52.130, 11.630" onchange="updateAdrCoordsField('${e.id}', this.value)" style="font-family:var(--font-mono);font-size:12px"></div>
          <p class="hint">Zählerplatz-ID: <span class="code">${escapeHtml(e.zaehlerplatzId || '–')}</span> · Kundencode: <span class="muted">${escapeHtml(e.kundencode || '–')}</span></p>
        </div>` : ''}
    </div>`;
  }).join('');

  return searchBar + `<div class="adr-card-list">${cards}</div>`;
}
function updateAdrCoordsField(entryId, value){
  if(!value.trim()){ updateAdrCoords(entryId, null); render(); return; }
  const parsed = parseCoords(value);
  if(!parsed){ showToast('Ungültiges Koordinatenformat, z.B. 52.130, 11.630'); render(); return; }
  updateAdrCoords(entryId, parsed);
  showToast('Gespeichert');
}

   Field updates
--------------------------------------------------------------- */
function updateCustomField(id, key, value, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  if(!a.customFields) a.customFields = {};
  const oldVal = a.customFields[key] || '';
  if(oldVal === value) return;
  a.history.push({ ts: nowIso(), field: key, old: oldVal, new: value });
  a.customFields[key] = value;
  saveAuftraege();
  if(!silent) showToast('Gespeichert');
}

function updateAuftragField(id, field, value, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const oldVal = a[field] || '';
  if(oldVal === value) return;
  a.history.push({ ts: nowIso(), field, old: oldVal, new: value });
  a[field] = value;
  saveAuftraege();

  // propagate persistent customer/meter fields into address book
  const propagatedFields = ['telefonnummer','email','adresse','kundenname','zaehler','bauform','standort'];
  if(propagatedFields.includes(field) && a.adrEntryId){
    updateAdrField(a.adrEntryId, field, value);
  }
  if(!silent) showToast('Gespeichert');
}

function setStatus(id, newStatus, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const old = a.status;
  if(old === newStatus) return;
  a.history.push({ ts: nowIso(), field:'status', old: STATUS[old].label, new: STATUS[newStatus].label });
  a.status = newStatus;
  saveAuftraege();
  if(!silent){
    render();
    showToast(newStatus === 'erledigt' ? 'Als erledigt markiert' : 'Status aktualisiert');
  }
}
